name: Update Dns List

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  convert_conf_files:
    name: Convert conf files
    runs-on: ubuntu-latest
    steps:

    - name: Checkout main branch
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.13

    - name: Install dependencies
      run: pip3 install glob2

    - name: Download dnsmasq-china-list 
      run: |
        wget https://github.com/felixonmars/dnsmasq-china-list/raw/refs/heads/master/accelerated-domains.china.conf
        wget https://github.com/felixonmars/dnsmasq-china-list/raw/refs/heads/master/apple.china.conf
        wget https://github.com/felixonmars/dnsmasq-china-list/raw/refs/heads/master/google.china.conf

    - name: Convert Conf Files
      env:
        CN_DNS: ${{ secrets.CN_DNS }}
        THE_DNS: ${{ secrets.THE_DNS }}
      run: |
        python convert.py
        rm ./*.china.conf

    - name: Create or checkout file branch
      run: |
        if git ls-remote --exit-code --heads origin file; then
          # 如果 file 分支存在，切换到它
          git add .
          git stash
          git fetch origin file
          git checkout file
        else
          # 如果 file 分支不存在，创建一个新的孤儿分支
          git checkout --orphan file
          git rm -rf .
          echo "# Dns分流文件" > README.md
          git add README.md
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Initial commit for file branch"
        fi

    - name: Check for changes
      run: |
        # 弹出 stash,如果有冲突则使用 stash 中的版本
        if ! git stash pop; then
          echo "Merge conflicts detected, resolving by accepting stashed changes..."
          # 对所有冲突文件使用 stash 中的版本
          git checkout --theirs .
          git add .
        fi
      
        if git status --porcelain | grep -q .; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          current_time=$(date +'%Y-%m-%d %H:%M:%S')
          git commit -m "Update file 🚀 - $current_time UTC"
        else
          echo "No changes to commit."
        fi

    - name: Push changes to file branch
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: file
